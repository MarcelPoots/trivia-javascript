<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        #trivia-question {
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.4;
        }

        #trivia-answer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .trivia-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .trivia-option:hover {
            background-color: #f2f2f2;
        }

        .trivia-option input[type="radio"] {
            flex-shrink: 0;
        }

        .trivia-option label {
            word-break: break-word;
            cursor: pointer;
        }

        button {
            display: block;
            margin: 20px auto 0;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Welcome to trivia</h1>

    <div id="category"></div>
    <p id="trivia-question">Question being fecthed..</p>
    <div id="trivia-answer">Answer will be shown here...</div>

    <button id="validate-trivia">Check results</button>
    <button id="fetch-trivia">Fetch new question</button>
    <p id="trivia-result"></p>

    <script src="./main.js"></script>
</body>
</html>
